[pytest]
# Os 18 repositorios clonados em research/sources tem suites proprias, rodadas pelo
# harness da rodada simples no ambiente que cada um declara. A suite do projeto so
# cobre o codigo deste repositorio.
testpaths = executor/tests lab/tests integracao/tests laboratorio/tests
norecursedirs = research/sources .venv* runs data integracao/cache integracao/estado
