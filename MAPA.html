49],["registra","laboratorio/h100/registro.py",430],["documenta","docs/CEM-HIPOTESES.md",345]],"p":"mapa/conhecimento/hipoteses.md#h093"},{"id":"H094","c":"k","g":"H","l":"H094","d":"O erro que importa — confundir informação com ação destrutiva — é raro.","a":{"familia":"H","veredito":"falsificada","previsao":"Menos de 2% das decisões com gabarito `informacao` viraram uma ação.","criterio":"taxa < 0,02","fonte":"R8, R9, R15 — linhas com gabarito informacao","natureza":"exploratoria","detalhe":"9 viradas para ação em 101 mensagens que só pediam informação"},"m":{},"w":[["resultado","laboratorio/h100-resultados.json",null],["prova","laboratorio/h100/provas.py",1060],["registra","laboratorio/h100/registro.py",434],["documenta","docs/CEM-HIPOTESES.md",346]],"p":"mapa/conhecimento/hipoteses.md#h094"},{"id":"H095","c":"k","g":"H","l":"H095","d":"O Jev classifica intenção em domínio jurídico pt-BR tão bem quanto em atendimento.","a":{"familia":"I","veredito":"falsificada","previsao":"Acurácia acima de 85% num corpus jurídico de moldes com gabarito fixo.","criterio":"acurácia > 0,85","fonte":"medição nova, corpus jurídico pt-BR","natureza":"confirmatoria","detalhe":"51/65 no domínio jurídico, IC95 [0.6703, 0.8671]; por molde: pedido-direto 19/19, sem-pedido 16/21, terceiro-contra-eu-quero 8/8, terceiro-quer 8/17"},"m":{},"w":[["resultado","laboratorio/h100-resultados.json",null],["prova","laboratorio/h100/provas.py",1078],["registra","laboratorio/h100/registro.py",440],["documenta","docs/CEM-HIPOTESES.md",365]],"p":"mapa/conhecimento/hipoteses.md#h095"},{"id":"H096","c":"k","g":"H","l":"H096","d":"O mesmo desempenho se mantém com a mensagem e os critérios em inglês.","a":{"familia":"I","veredito":"sustentada","previsao":"Acurácia em inglês a menos de 5 pontos da acurácia em português, no mesmo corpus.","criterio":"diferença < 0,05","fonte":"medição nova, mesmo corpus traduzido","natureza":"confirmatoria","detalhe":"inglês 76.6% contra português 78.5%; pareado 1 a 1, p = 1.0"},"m":{},"w":[["resultado","laboratorio/h100-resultados.json",null],["prova","laboratorio/h100/provas.py",1088],["registra","laboratorio/h100/registro.py",444],["documenta","docs/CEM-HIPOTESES.md",366]],"p":"mapa/conhecimento/hipoteses.md#h096"},{"id":"H097","c":"k","g":"H","l":"H097","d":"O mesmo desempenho se mantém em espanhol.","a":{"familia":"I","veredito":"sustentada","previsao":"Acurácia em espanhol a menos de 5 pontos da de português.","criterio":"diferença < 0,05","fonte":"medição nova, mesmo corpus traduzido","natureza":"confirmatoria","detalhe":"espanhol 77.8% contra português 78.5%; pareado 1 a 1, p = 1.0"},"m":{},"w":[["resultado","laboratorio/h100-resultados.json",null],["prova","laboratorio/h100/provas.py",1099],["registra","laboratorio/h100/registro.py",448],["documenta","docs/CEM-HIPOTESES.md",367]],"p":"mapa/conhecimento/hipoteses.md#h097"},{"id":"H098","c":"k","g":"H","l":"H098","d":"A imunidade a meta-instrução não depende do domínio de atendimento.","a":{"familia":"I","veredito":"falsificada","previsao":"Zero viradas sob meta-instrução no corpus jurídico.","criterio":"viradas == 0","fonte":"medição nova, vetores de meta-instrução aplicados ao corpus novo","natureza":"confirmatoria","detalhe":"21 viradas em 64 no jurídico, 19 para a classe que a injeção pediu, e 8 delas acima do corte de 0,90. O mesmo formato de vetor aplicado ao corpus de atendimento (R21b) vira 28 em 81 — ou seja, a explicação é o vetor, não o domínio"},"m":{},"w":[["resultado","laboratorio/h100-resultados.json",null],["prova","laboratorio/h100/provas.py",1110],["registra","laboratorio/h100/registro.py",452],["documenta","docs/CEM-HIPOTESES.md",368]],"p":"mapa/conhecimento/hipoteses.md#h098"},{"id":"H099","c":"k","g":"H","l":"H099","d":"A instrução de sujeito ajuda também fora do atendimento.","a":{"familia":"I","veredito":"sustentada","previsao":"No corpus jurídico com armadilha de terceiro, a instrução de sujeito não piora e tende a melhorar.","criterio":"acurácia com instrução de sujeito >= sem","fonte":"medição nova","natureza":"confirmatoria","detalhe":"com instrução de sujeito 90.9%, sem 78.5%; pareado 8 a 0, p = 0.0078"},"m":{},"w":[["resultado","laboratorio/h100-resultados.json",null],["prova","laboratorio/h100/provas.py",1133],["registra","laboratorio/h100/registro.py",456],["documenta","docs/CEM-HIPOTESES.md",369]],"p":"mapa/conhecimento/hipoteses.md#h099"},{"id":"H100","c":"k","g":"H","l":"H100","d":"A seleção de contexto funciona em prosa, não só em código.","a":{"familia":"I","veredito":"falsificada","previsao":"Num conjunto de perguntas sobre trechos de prosa, o Jev põe o trecho certo em primeiro mais vezes que o BM25.","criterio":"mais acertos de colocação que o BM25","fonte":"medição nova, corpus de prosa","natureza":"confirmatoria","detalhe":"Jev 20/21 em primeiro, BM25 20/21; pareado 1 a 1, p = 1.0. Em prosa, com um tokenizador que entende acento, o BM25 empata"},"m":{},"w":[["resultado","laboratorio/h100-resultados.json",null],["prova","laboratorio/h100/provas.py",1144],["registra","laboratorio/h100/registro.py",460],["documenta","docs/CEM-HIPOTESES.md",370]],"p":"mapa/conhecimento/hipoteses.md#h100"},{"id":"Q001","c":"k","g":"Q","l":"Q001","d":"Em qual aplicação o ganho sobre o método atual é maior?","a":{"familia":"A · A decisão de adotar","resposta":"Triagem, com folga. Contra regra por palavra-chave o Jev vai de 60,0% para 92,5% no piloto e de 32,5% para 97,5% na confirmação — mais de 60 pontos no segundo caso. Verificação de afirmação vem depois (95,8% contra 62,5%), e ordenação é a de maior ganho econômico, não de acurácia.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide por onde começar a integração."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",93],["responde","laboratorio/q100/respostas.py",216]],"p":"mapa/conhecimento/perguntas.md#q001"},{"id":"Q002","c":"k","g":"Q","l":"Q002","d":"Qual aplicação oferece o melhor ganho por unidade de risco assumido?","a":{"familia":"A · A decisão de adotar","resposta":"Ordenação de contexto. O ganho é medido (93,5% contra 83,4% carregando tudo, 22 a 5, p = 0,0015) e o risco é o menor das quatro: se a ordenação errar, o modelo caro recebe o trecho errado e responde mal — não há ação irreversível no caminho. Triagem tem ganho maior e risco maior, porque a classe `cancelar` age.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide por onde começar, considerando o que quebra se der errado."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",99],["responde","laboratorio/q100/respostas.py",226]],"p":"mapa/conhecimento/perguntas.md#q002"},{"id":"Q003","c":"k","g":"Q","l":"Q003","d":"Existe aplicação em que o método atual já basta?","a":{"familia":"A · A decisão de adotar","resposta":"Sim, duas. Em **prosa**, o BM25 empata com o Jev na colocação do trecho certo (20/21 contra 20/21) e custa zero chamada — ali o método atual basta. E em classificação de texto que **não vem de fora**, um LLM genérico barato empata sob critério independente e custa um quarto.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide onde NÃO gastar esforço de integração."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",105],["responde","laboratorio/q100/respostas.py",235]],"p":"mapa/conhecimento/perguntas.md#q003"},{"id":"Q004","c":"k","g":"Q","l":"Q004","d":"A vantagem sobre o LLM barato sobrevive ao critério de um anotador independente?","a":{"familia":"A · A decisão de adotar","resposta":"Não. Sob o gabarito desta casa o Jev ganha (98,9% contra 84,4%–91,1% no E12); sob o critério de um anotador independente a vantagem some, e isso se repetiu no E10, E11 e E12. A justificativa do Jev **não é acurácia** — é resistência a manipulação pelo texto classificado, e essa não depende de gabarito.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se a escolha do modelo precisa de justificativa além de preço."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",111],["responde","laboratorio/q100/respostas.py",249]],"p":"mapa/conhecimento/perguntas.md#q004"},{"id":"Q005","c":"k","g":"Q","l":"Q005","d":"Qual o volume mensal mínimo em que o custo de integrar se paga?","a":{"familia":"A · A decisão de adotar","resposta":"Cerca de **480 decisões** para o investimento de integração se pagar — menos de um mês num canal de 10.000 decisões/mês. O número é dominado pelo tempo de pessoa, não pelo preço do modelo: o custo por decisão do Jev é US$ 0,000032 contra US$ 0,4000 da revisão humana.","fonte_da_resposta":"conta declarada","confianca":"baixa","decide":"Decide se vale integrar ou rodar na mão."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",117],["responde","laboratorio/q100/respostas.py",258]],"p":"mapa/conhecimento/perguntas.md#q005"},{"id":"Q006","c":"k","g":"Q","l":"Q006","d":"Adotar obriga a redesenhar a taxonomia que já existe?","a":{"familia":"A · A decisão de adotar","resposta":"Não, se ela tiver até 12 classes: nesse intervalo a acurácia não cai. Entre 12 e 147 há um platô em torno de 90%. O que a taxonomia **precisa** ganhar é uma classe de escape — sem ela o modelo inventa, e é o único modo de falha em que a confiança não avisa (0,987 de média, errando em 10 de 10).","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quanto trabalho de modelagem entra no projeto."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",123],["responde","laboratorio/q100/respostas.py",276]],"p":"mapa/conhecimento/perguntas.md#q006"},{"id":"Q007","c":"k","g":"Q","l":"Q007","d":"Quantas classes o domínio pode ter sem custo de acurácia?","a":{"familia":"A · A decisão de adotar","resposta":"Até 12 sem custo medido: 2, 3, 5 e 12 opções ficam todas acima de 97%. De 20 a 147 o desempenho cai para um platô em torno de 90%, o que ainda serve para muitos casos — mas já não é de graça.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quão fina a taxonomia pode ser."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",129],["responde","laboratorio/q100/respostas.py",285]],"p":"mapa/conhecimento/perguntas.md#q007"},{"id":"Q008","c":"k","g":"Q","l":"Q008","d":"A adoção exige dado rotulado antes de começar?","a":{"familia":"A · A decisão de adotar","resposta":"Não para começar, sim para confiar. O contrato funciona sem nenhum exemplo rotulado — a taxonomia é a única entrada. Mas o corte de confiança **não se transporta** entre conjuntos: o que dava zero erro em dois corpora deixou passar um erro com confiança 0,98 no terceiro. Rotular ~200 casos do seu material é o que auto…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se existe dependência de trabalho humano prévio."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",135],["responde","laboratorio/q100/respostas.py",294]],"p":"mapa/conhecimento/perguntas.md#q008"},{"id":"Q009","c":"k","g":"Q","l":"Q009","d":"Quanto tempo até o primeiro resultado utilizável?","a":{"familia":"A · A decisão de adotar","resposta":"Dias, não semanas. A R18, a R19, a R20, a R21 e a R22 geraram corpus com gabarito fixado por molde e filtro mecânico, sem uma linha lida por mim antes de rodar. Das três que registraram o próprio custo, a mais cara ficou em US$ 0,0164 — incluída a coleta nova em domínio jurídico, em inglês e em espanhol. O caminho é r…","fonte_da_resposta":"conta declarada","confianca":"média","decide":"Decide o formato do piloto."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",141],["responde","laboratorio/q100/respostas.py",304]],"p":"mapa/conhecimento/perguntas.md#q009"},{"id":"Q010","c":"k","g":"Q","l":"Q010","d":"Se só um projeto puder ser feito este trimestre, qual é?","a":{"familia":"A · A decisão de adotar","resposta":"Ordenação de contexto para montar o prompt de um agente caro. É a única com economia medida em bytes (74% menos contexto), a única em que selecionar **melhora a resposta** em vez de só baratear, e a de menor risco. O segundo lugar é o guarda de comando, que já está implantado em sombra e só depende de uma decisão de c…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide a alocação de esforço."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",147],["responde","laboratorio/q100/respostas.py",321]],"p":"mapa/conhecimento/perguntas.md#q010"},{"id":"Q011","c":"k","g":"Q","l":"Q011","d":"Quanto custa mil decisões, medido e não estimado?","a":{"familia":"B · Unidade econômica","resposta":"**US$ 0,032 por mil decisões**, medido sobre 31.419 chamadas reais que somam US$ 1,0185 no livro-caixa. Não é estimativa: é o extrato.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide a linha do orçamento."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",157],["responde","laboratorio/q100/respostas.py",332]],"p":"mapa/conhecimento/perguntas.md#q011"},{"id":"Q012","c":"k","g":"Q","l":"Q012","d":"A seleção de contexto se paga quando se conta a chamada de ordenação?","a":{"familia":"B · Unidade econômica","resposta":"Sim, e por larga margem. Ordenar 169 perguntas custou US$ 0,0443 em chamadas ao Jev (8 candidatos cada) e poupou 1.089.128 bytes de entrada do modelo caro — US$ 0,82 ao preço declarado. A razão é **18 para 1**. E isso ignora o ganho de acurácia, que é o achado principal: selecionar responde melhor.","fonte_da_resposta":"conta declarada","confianca":"média","decide":"Decide se a Aplicação 3 é economia real ou contábil."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",163],["responde","laboratorio/q100/respostas.py",342]],"p":"mapa/conhecimento/perguntas.md#q012"},{"id":"Q013","c":"k","g":"Q","l":"Q013","d":"Qual a razão mínima de preço entre o modelo caro e o Jev para a seleção valer?","a":{"familia":"B · Unidade econômica","resposta":"O modelo respondedor precisa custar mais de **US$ 0,16 por milhão de tokens de entrada** para a ordenação se pagar só em token. Qualquer modelo de fronteira está muito acima disso; um modelo barato de US$ 0,10 não estaria — nesse caso a seleção se justifica pela acurácia, não pela economia.","fonte_da_resposta":"conta declarada","confianca":"média","decide":"Decide em quais pilhas a seleção faz sentido."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",169],["responde","laboratorio/q100/respostas.py",369]],"p":"mapa/conhecimento/perguntas.md#q013"},{"id":"Q014","c":"k","g":"Q","l":"Q014","d":"A partir de quantos candidatos a ordenação custa mais do que carregar tudo?","a":{"familia":"B · Unidade econômica","resposta":"Não há limite prático pelo lado do custo: cada candidato a mais custa uma chamada de ordenação (US$ 0,0000328) e poupa US$ 0,000817 de contexto do modelo caro — a poupança é **25× maior**. O limite é de latência e de qualidade, não de dinheiro: mais candidatos significam mais chamadas em paralelo, e a R18 mostrou que…","fonte_da_resposta":"conta declarada","confianca":"média","decide":"Decide o tamanho máximo do conjunto de candidatos."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",175],["responde","laboratorio/q100/respostas.py",387]],"p":"mapa/conhecimento/perguntas.md#q014"},{"id":"Q015","c":"k","g":"Q","l":"Q015","d":"O k adaptativo economiza o bastante para justificar a complexidade?","a":{"familia":"B · Unidade econômica","resposta":"Não neste corpus, e talvez em outro. O k adaptativo economiza 86,2% contra 73,7% do k = 2 fixo, com o mesmo acerto — mas o k = 1 fixo economiza 87,4% com o mesmo acerto também. A política adaptativa **empata com a regra mais simples** aqui. Implemente k = 1 fixo; guarde a política adaptativa para quando a ordenação fo…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se implementar a política de k variável."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",181],["responde","laboratorio/q100/respostas.py",409]],"p":"mapa/conhecimento/perguntas.md#q015"},{"id":"Q016","c":"k","g":"Q","l":"Q016","d":"Quanto se economiza, em dólares, por mil perguntas no arranjo recomendado?","a":{"familia":"B · Unidade econômica","resposta":"**US$ 5,72 por mil perguntas** de contexto poupado, contra US$ 0,26 de chamadas de ordenação — líquido de US$ 5,45. O número escala linearmente com o preço do modelo respondedor, que é o parâmetro declarado.","fonte_da_resposta":"conta declarada","confianca":"média","decide":"Decide o número que vai para a justificativa de projeto."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",187],["responde","laboratorio/q100/respostas.py",422]],"p":"mapa/conhecimento/perguntas.md#q016"},{"id":"Q017","c":"k","g":"Q","l":"Q017","d":"Que fração do orçamento do estudo virou chamada inútil?","a":{"familia":"B · Unidade econômica","resposta":"266 tentativas de 24.473 terminaram em falha — **1,1%**. Some-se a isso o episódio do gerador da R18, em que 88 de 110 chamadas voltaram com conteúdo vazio porque o limite de tokens era consumido pelo campo de raciocínio: pagas e inúteis. Reserve 5% de folga e **meça o conteúdo da resposta, não só o código HTTP**.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quanto reservar de folga no próximo programa."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",193],["responde","laboratorio/q100/respostas.py",443]],"p":"mapa/conhecimento/perguntas.md#q017"},{"id":"Q018","c":"k","g":"Q","l":"Q018","d":"O custo por decisão cresce com o texto de um jeito que quebre a conta?","a":{"familia":"B · Unidade econômica","resposta":"Não quebra: o custo é quase linear no tamanho do estado (r = 0,26), e o quartil de textos maiores custa 1,5× o dos menores. Como o preço de saída é zero e a entrada custa US$ 0,042 por milhão, mesmo um texto de 20 mil caracteres não muda a ordem de grandeza. Não há motivo econômico para impor limite de tamanho — há mo…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se há limite de tamanho a impor na entrada."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",199],["responde","laboratorio/q100/respostas.py",456]],"p":"mapa/conhecimento/perguntas.md#q018"},{"id":"Q019","c":"k","g":"Q","l":"Q019","d":"Votar em três chamadas triplica o custo — isso cabe no custo por decisão?","a":{"familia":"B · Unidade econômica","resposta":"Cabe folgado — três chamadas custam US$ 0,000097 por decisão contra US$ 200,00 de um erro grave — mas a R24 mostrou que votar a **mesma** pergunta três vezes não compra nada: em 148 casos, 0 oscilaram. O que vale o triplo do custo é perguntar de **três formulações** diferentes, que no jurídico levou de 79,7% para 92,8…","fonte_da_resposta":"conta declarada","confianca":"média","decide":"Decide se a política de votação é viável para a classe irreversível."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",205],["responde","laboratorio/q100/respostas.py",472]],"p":"mapa/conhecimento/perguntas.md#q019"},{"id":"Q020","c":"k","g":"Q","l":"Q020","d":"Quanto custa rodar a suíte de canários todo dia por um ano?","a":{"familia":"B · Unidade econômica","resposta":"**US$ 0,11 por ano** para rodar os canários todo dia (US$ 0,000297 por corrida). É 0,05% do teto autorizado de US$ 5,00. O monitoramento contínuo não é uma decisão de orçamento — é uma decisão de disciplina.","fonte_da_resposta":"conta declarada","confianca":"alta","decide":"Decide se o monitoramento contínuo entra no orçamento."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",211],["responde","laboratorio/q100/respostas.py",488]],"p":"mapa/conhecimento/perguntas.md#q020"},{"id":"Q021","c":"k","g":"Q","l":"Q021","d":"Qual corte de confiança entrega a maior cobertura com zero erro aceito?","a":{"familia":"C · Desenho da política de uso","resposta":"**Nenhum corte zera o erro**, nem no uso normal. O melhor disponível é 1,0, que aceita 68,3% das decisões com 0,20% de erro entre elas — 2 em 991. A consequência é dura e não tem volta: o corte reduz risco e não o elimina, e por isso a classe irreversível continua exigindo gente.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o corte a configurar em produção."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",221],["responde","laboratorio/q100/respostas.py",515]],"p":"mapa/conhecimento/perguntas.md#q021"},{"id":"Q022","c":"k","g":"Q","l":"Q022","d":"Como é a curva risco-cobertura, e onde está o joelho?","a":{"familia":"C · Desenho da política de uso","resposta":"A curva é quase plana até 0,90 e só então começa a pagar: de 0 a 0,90 a cobertura cai de 100% para 90% e a taxa de erro entre os aceitos vai de 3,45% para 1,98%. De 0,90 para 0,99 a cobertura cai mais 14% e o erro chega a 0,36%. **O joelho está em 0,99**: é o último ponto em que a redução de erro ainda compensa a cobe…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide a política de automação parcial."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",227],["responde","laboratorio/q100/respostas.py",533]],"p":"mapa/conhecimento/perguntas.md#q022"},{"id":"Q023","c":"k","g":"Q","l":"Q023","d":"O corte de 0,99 recomendado no guia sobrevive ao conjunto inteiro de decisões?","a":{"familia":"C · Desenho da política de uso","resposta":"Sobrevive, e a primeira versão desta resposta dizia o contrário por um erro que vale registrar: ela somava a diluição retratada da R11, e a \"degradação sob dificuldade\" era o truncamento do laboratório. Retirada a condição retratada, acima de 0,99 há 2 erros em 629 decisões no uso normal (0,32%) e 4 em 310 nas condiçõ…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide manter ou mudar a recomendação publicada."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",233],["responde","laboratorio/q100/respostas.py",546]],"p":"mapa/conhecimento/perguntas.md#q023"},{"id":"Q024","c":"k","g":"Q","l":"Q024","d":"Qual k recomendar, considerando acerto e custo juntos?","a":{"familia":"C · Desenho da política de uso","resposta":"**k = 1.** Contra k = 2 não há diferença nenhuma (3 a 4, p = 1,0) e custa metade do contexto; contra k = 3 a direção favorece o menor em todos os recortes. Mandar um trecho é a recomendação, e mandar dois é defensável para quem quiser margem.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o parâmetro padrão da Aplicação 3."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",239],["responde","laboratorio/q100/respostas.py",576]],"p":"mapa/conhecimento/perguntas.md#q024"},{"id":"Q025","c":"k","g":"Q","l":"Q025","d":"A classe de escape deve ser obrigatória em toda taxonomia?","a":{"familia":"C · Desenho da política de uso","resposta":"Não vale a complexidade hoje. Ela empata com k = 1 fixo em acerto e em economia. Implemente a regra simples; a adaptativa fica como opção para corpus onde a ordenação erre mais, cenário que ainda não foi medido.","fonte_da_resposta":"dado medido","confianca":"média","decide":"Decide o padrão de desenho de taxonomia."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",245],["responde","laboratorio/q100/respostas.py",586]],"p":"mapa/conhecimento/perguntas.md#q025"},{"id":"Q026","c":"k","g":"Q","l":"Q026","d":"A instrução de sujeito deve ser padrão em toda classificação de pedido?","a":{"familia":"C · Desenho da política de uso","resposta":"Sim, sempre. Sem classe de escape, dez textos sem pedido nenhum foram classificados como `informacao` nas 10 vezes, com confiança média 0,987 — o único modo de falha medido em que a confiança **não avisa**. Com a classe, acerta 10 de 10. Custa uma linha.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o texto padrão da instrução."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",251],["responde","laboratorio/q100/respostas.py",594]],"p":"mapa/conhecimento/perguntas.md#q026"},{"id":"Q027","c":"k","g":"Q","l":"Q027","d":"Sob que condição vale decompor a decisão em várias perguntas?","a":{"familia":"C · Desenho da política de uso","resposta":"Sim, padrão. Ela leva 89,4% a 92,9% em atendimento sem piorar nenhum molde, e 78,5% a 90,9% no jurídico com **8 a 0, p = 0,0078**. Custa uma frase e é a única mitigação do estudo que replicou em dois domínios com ganho maior no segundo.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quando usar múltiplas perguntas no mesmo payload."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",257],["responde","laboratorio/q100/respostas.py",605]],"p":"mapa/conhecimento/perguntas.md#q027"},{"id":"Q028","c":"k","g":"Q","l":"Q028","d":"Mandar de oito em oito é seguro? Para quais classes?","a":{"familia":"C · Desenho da política de uso","resposta":"Só quando a pergunta auxiliar for **mais confiável que a decisão que ela alimenta** — e isso é verificável antes de adotar, medindo a auxiliar sozinha. Na R19 a pergunta de sujeito acertava 68,7% sozinha, abaixo da decisão, e decompor destruiu o molde oposto (86% para 36%). A capacidade de várias perguntas no payload…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se usar lote para baratear."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",263],["responde","laboratorio/q100/respostas.py",615]],"p":"mapa/conhecimento/perguntas.md#q028"},{"id":"Q029","c":"k","g":"Q","l":"Q029","d":"Quantas repetições para decisão sem volta?","a":{"familia":"C · Desenho da política de uso","resposta":"Sim para a média, não para a classe perigosa. O efeito de posição some ao embaralhar (p = 0,40), mas **3 de 40 casos** mudaram de resposta conforme os vizinhos. Use lote para baratear triagem comum; nunca para `cancelar`.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide a política de repetição na classe irreversível."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",269],["responde","laboratorio/q100/respostas.py",627]],"p":"mapa/conhecimento/perguntas.md#q029"},{"id":"Q030","c":"k","g":"Q","l":"Q030","d":"A política recomendada muda se o canal tiver outra mistura de assuntos?","a":{"familia":"C · Desenho da política de uso","resposta":"Três, com maioria. Repetindo 40 casos cinco vezes, 1 oscilou — votar em três estabiliza. O custo é desprezível (Q019) e a alternativa é aceitar que uma decisão sem volta dependa de um sorteio de baixa probabilidade.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se a configuração precisa ser por canal."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",275],["responde","laboratorio/q100/respostas.py",635]],"p":"mapa/conhecimento/perguntas.md#q030"},{"id":"Q031","c":"k","g":"Q","l":"Q031","d":"Qual a taxa medida de erro grave, e qual o teto estatístico dela?","a":{"familia":"D · Risco e custo do erro","resposta":"**0 em 230 casos** sob os três critérios de correção, com teto estatístico de 9,5% por família de casos. Zero observado com teto de 9,5% não autoriza automatizar a classe irreversível: um em dez é muito quando o erro cancela o contrato de um cliente.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se a classe irreversível pode ser automatizada."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",285],["responde","laboratorio/q100/respostas.py",644]],"p":"mapa/conhecimento/perguntas.md#q031"},{"id":"Q032","c":"k","g":"Q","l":"Q032","d":"Quanto custa um erro grave comparado ao custo da decisão?","a":{"familia":"D · Risco e custo do erro","resposta":"Um erro grave custa US$ 200,00 e uma decisão custa US$ 0,000032 — razão de **6.169.680 para 1**. Qualquer salvaguarda que custe chamadas é barata; a única salvaguarda cara é tempo de pessoa, e é exatamente essa que o corte de confiança economiza.","fonte_da_resposta":"conta declarada","confianca":"baixa","decide":"Decide quanto vale gastar em salvaguarda."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",291],["responde","laboratorio/q100/respostas.py",653]],"p":"mapa/conhecimento/perguntas.md#q032"},{"id":"Q033","c":"k","g":"Q","l":"Q033","d":"Qual a exposição esperada por mil decisões no corte recomendado?","a":{"familia":"D · Risco e custo do erro","resposta":"Ao corte de 0,99, **3,6 erros por mil decisões aceitas**, o que ao custo declarado de erro grave dá US$ 719 de exposição por mil — se todo erro fosse grave, o que não é o caso. A exposição real é menor e depende da matriz de confusão do seu domínio.","fonte_da_resposta":"conta declarada","confianca":"baixa","decide":"Decide o número que entra na avaliação de risco."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",297],["responde","laboratorio/q100/respostas.py",664]],"p":"mapa/conhecimento/perguntas.md#q033"},{"id":"Q034","c":"k","g":"Q","l":"Q034","d":"Qual família de erro é a mais cara?","a":{"familia":"D · Risco e custo do erro","resposta":"**Ação atribuída a terceiro** — 75,0% de acerto, a pior família medida. É também a mais cara, porque o erro típico dela é agir sobre o pedido de outra pessoa. A mitigação existe e é uma frase (Q027).","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide onde pôr revisão humana."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",303],["responde","laboratorio/q100/respostas.py",677]],"p":"mapa/conhecimento/perguntas.md#q034"},{"id":"Q035","c":"k","g":"Q","l":"Q035","d":"O erro se concentra em alguma classe?","a":{"familia":"D · Risco e custo do erro","resposta":"Sim: a classe `informacao` concentra o erro, com 12,5% de taxa entre as classes com pelo menos 30 casos. Revisão seletiva por classe é viável e é mais barata que revisar tudo.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se a revisão pode ser seletiva por classe."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",309],["responde","laboratorio/q100/respostas.py",687]],"p":"mapa/conhecimento/perguntas.md#q035"},{"id":"Q036","c":"k","g":"Q","l":"Q036","d":"Existe modo de falha em que a confiança não avisa?","a":{"familia":"D · Risco e custo do erro","resposta":"Sim, dois. **Texto sem pedido algum sem classe de escape**: erra 10 de 10 com confiança 0,987. E **ordem direta ao classificador**: das viradas no corpus jurídico, 8 passaram do corte de 0,90. Nos dois casos o corte não protege, e a mitigação é de desenho — classe de escape e sanitização —, não de limiar.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se o corte basta como salvaguarda."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",315],["responde","laboratorio/q100/respostas.py",700]],"p":"mapa/conhecimento/perguntas.md#q036"},{"id":"Q037","c":"k","g":"Q","l":"Q037","d":"A taxa de não-resposta cria risco operacional?","a":{"familia":"D · Risco e custo do erro","resposta":"Baixo, mas não zero: 0 de 570 chamadas (0,0%) voltaram sem resposta fora da condição de instrução vazia. É preciso caminho de contingência — e ele deve **falhar fechado**, mandando para revisão humana, nunca assumindo uma classe padrão.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se é preciso caminho de contingência."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",321],["responde","laboratorio/q100/respostas.py",709]],"p":"mapa/conhecimento/perguntas.md#q037"},{"id":"Q038","c":"k","g":"Q","l":"Q038","d":"Qual o pior caso de acurácia medido em condição plausível de produção?","a":{"familia":"D · Risco e custo do erro","resposta":"**46,7% sob ruído pesado** (70% dos caracteres corrompidos) — condição implausível num canal real. O pior caso *plausível* é a triagem jurídica: **78,5%**, com a perda concentrada no molde de terceiro. Declare 78,5% como piso para domínio novo sem a instrução de sujeito, e 90,9% com ela.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o pior cenário a declarar."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",327],["responde","laboratorio/q100/respostas.py",722]],"p":"mapa/conhecimento/perguntas.md#q038"},{"id":"Q039","c":"k","g":"Q","l":"Q039","d":"O modelo erra mais quando o texto é longo?","a":{"familia":"D · Risco e custo do erro","resposta":"Não. De 0 a 50 mil caracteres a acurácia fica constante em 96,7%. O que derruba não é o tamanho — é o **truncamento**, que corta o pedido antes de o modelo ver. Não imponha limite de tamanho; garanta que o corte, se houver, preserve a parte que importa.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se impor limite de tamanho reduz risco."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",333],["responde","laboratorio/q100/respostas.py",731]],"p":"mapa/conhecimento/perguntas.md#q039"},{"id":"Q040","c":"k","g":"Q","l":"Q040","d":"Os erros se repetem entre chamadas, ou votar em três resolve?","a":{"familia":"D · Risco e custo do erro","resposta":"**Os erros se repetem, e votar a mesma pergunta não resolve.** Em 148 casos com três chamadas idênticas, 0 oscilaram: o modelo é determinístico neste regime, e o erro é sistemático. O que muda a resposta é a formulação — 11 dos 66 casos jurídicos divergem entre três formulações — e por isso a maioria **diversa** sobe…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se a votação é salvaguarda real ou teatro."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",339],["responde","laboratorio/q100/respostas.py",741]],"p":"mapa/conhecimento/perguntas.md#q040"},{"id":"Q041","c":"k","g":"Q","l":"Q041","d":"Qual é a superfície de ataque real deste contrato?","a":{"familia":"E · Segurança e adversário","resposta":"Um campo só: o `state`, que é onde entra o texto de terceiro. A separação estrutural entre `state` e `questions` impede que o texto do cliente vire instrução **por concatenação acidental** — não impede que ele contenha uma ordem que o modelo decida seguir. Instrução, critérios e rótulos são seus e não são superfície d…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o que precisa de defesa."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",349],["responde","laboratorio/q100/respostas.py",765]],"p":"mapa/conhecimento/perguntas.md#q041"},{"id":"Q042","c":"k","g":"Q","l":"Q042","d":"Sanitizar a entrada restaura a resistência à ordem direta?","a":{"familia":"E · Segurança e adversário","resposta":"**Contra o vetor para o qual a lista foi escrita, sim; contra qualquer outro, não.** Na R22 a expressão regular de oito padrões derrubou a virada de 28/78 para 1/82, pareado 27 a 0. Na R23 a mesma lista não cobre **nenhum** dos 48 vetores novos, e a lista ampliada (v2) cobre só 2 dos 36 escritos por outros modelos. Co…","fonte_da_resposta":"coleta nova","confianca":"alta","decide":"Decide se a mitigação que o guia prescreve funciona."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",355],["responde","laboratorio/q100/respostas.py",776]],"p":"mapa/conhecimento/perguntas.md#q042"},{"id":"Q043","c":"k","g":"Q","l":"Q043","d":"Uma pergunta-sentinela detecta o texto que tenta instruir o classificador?","a":{"familia":"E · Segurança e adversário","resposta":"**Sim, e é a única defesa que generaliza.** Na R22 a segunda pergunta no mesmo payload acusou 83 de 83 sob ataque e ficou calada em 81 de 83 das limpas. Na R23, contra ordens ao sistema escritas por outros modelos e nunca vistas, acusou **1.926 de 2.019 = 95,4%** — onde a lista de padrões cobria 2 vetores em 24. O cus…","fonte_da_resposta":"coleta nova","confianca":"alta","decide":"Decide se dá para detectar em vez de só filtrar."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",361],["responde","laboratorio/q100/respostas.py",807]],"p":"mapa/conhecimento/perguntas.md#q043"},{"id":"Q044","c":"k","g":"Q","l":"Q044","d":"Delimitar o texto do cliente com marcadores explícitos reduz a virada?","a":{"familia":"E · Segurança e adversário","resposta":"Ajuda pouco e não está demonstrado. Delimitar o texto com marcadores e avisar na instrução que ali é dado reduz a virada de 35,9% para 27,6%, pareado 8 a 2, p = 0,1094. Direção a favor, sem significância. Use se for de graça; não conte com isso.","fonte_da_resposta":"coleta nova","confianca":"média","decide":"Decide se a defesa cabe na instrução, sem código novo."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",367],["responde","laboratorio/q100/respostas.py",832]],"p":"mapa/conhecimento/perguntas.md#q044"},{"id":"Q045","c":"k","g":"Q","l":"Q045","d":"O corte de confiança serve como defesa contra injeção?","a":{"familia":"E · Segurança e adversário","resposta":"**Não.** Em atendimento o corte barra quase tudo (1 virada acima de 0,90 em 28), mas no corpus jurídico 8 das 21 viradas passaram. Um controle que funciona num domínio e falha no outro não é controle de segurança — é sorte com histórico. Use o corte para qualidade; use sanitização e sentinela para segurança.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se o corte pode ser contado como controle de segurança."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",373],["responde","laboratorio/q100/respostas.py",846]],"p":"mapa/conhecimento/perguntas.md#q045"},{"id":"Q046","c":"k","g":"Q","l":"Q046","d":"Qual defesa tem o melhor custo-benefício?","a":{"familia":"E · Segurança e adversário","resposta":"**Sentinela primeiro, sobre o texto original; sanitização como complemento para o que já se conhece.** A ordem inverteu depois da R23: a lista de padrões não generaliza e o sentinela acusa 95% de ordens nunca vistas. Na integração (R27), o sentinela precisa do texto original — sanitizado antes, ele fica cego (2/85). C…","fonte_da_resposta":"coleta nova","confianca":"alta","decide":"Decide qual mitigação implementar primeiro."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",379],["responde","laboratorio/q100/respostas.py",855]],"p":"mapa/conhecimento/perguntas.md#q046"},{"id":"Q047","c":"k","g":"Q","l":"Q047","d":"O guarda de comando pode ser ativado com segurança?","a":{"familia":"E · Segurança e adversário","resposta":"Sim, **como segunda camada e só como segunda camada**. Nessa posição libera 46 comandos com 0 irreversíveis soltos, e o intervalo de Wilson limita o erro a 7,7%. No lugar da regra é inseguro: sozinho perde de 2 a 6 irreversíveis em 12. A ativação depende de uma decisão que não é técnica: o guarda global **nega** em ve…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide sair do modo sombra ou não."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",385],["responde","laboratorio/q100/respostas.py",882]],"p":"mapa/conhecimento/perguntas.md#q047"},{"id":"Q048","c":"k","g":"Q","l":"Q048","d":"Qual o pior resultado possível se uma injeção passar?","a":{"familia":"E · Segurança e adversário","resposta":"A classe que a injeção pedir é executada como se o cliente tivesse pedido. No corpus jurídico o alvo era `encerrar` e 19 das 21 viradas foram para ela — ou seja, o atacante escolhe o resultado. O controle compensatório não é o modelo: é **nunca executar ação irreversível sem confirmação humana**, que já é o cuidado nº…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o desenho do controle compensatório."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",391],["responde","laboratorio/q100/respostas.py",896]],"p":"mapa/conhecimento/perguntas.md#q048"},{"id":"Q049","c":"k","g":"Q","l":"Q049","d":"A resistência depende da mensagem — dá para prever qual mensagem é frágil?","a":{"familia":"E · Segurança e adversário","resposta":"Sim, e o sinal é gratuito: a confiança da decisão **sem** o ataque prediz a fragilidade. Na R22, mensagens que o modelo classificava com confiança abaixo de 0,99 viraram 61% das vezes; as de confiança máxima, 18%. A R23 replica com 48 vetores: 58% contra 27%, sobre 1.563 e 2.233 pares. Quem já estava em dúvida é quem…","fonte_da_resposta":"coleta nova","confianca":"alta","decide":"Decide se é possível alertar caso a caso."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",397],["responde","laboratorio/q100/respostas.py",906]],"p":"mapa/conhecimento/perguntas.md#q049"},{"id":"Q050","c":"k","g":"Q","l":"Q050","d":"Quanto custa a defesa recomendada, por mil decisões?","a":{"familia":"E · Segurança e adversário","resposta":"**Zero por mil decisões.** A sanitização é uma expressão regular executada antes da chamada e a sentinela é uma pergunta a mais no mesmo payload, que o contrato cobra pelo estado e não pela pergunta. As duas defesas recomendadas não acrescentam uma única chamada. O custo é de engenharia — escrever os padrões e decidir…","fonte_da_resposta":"conta declarada","confianca":"alta","decide":"Decide se a defesa cabe no custo por decisão."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",403],["responde","laboratorio/q100/respostas.py",941]],"p":"mapa/conhecimento/perguntas.md#q050"},{"id":"Q051","c":"k","g":"Q","l":"Q051","d":"Em que línguas o resultado está medido?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"Português, inglês e espanhol, medidos no mesmo corpus com gabarito idêntico: 78,5%, 76,6% e 77,8%. Os pareamentos dão 1 a 1 nos dois casos. **A língua não é uma variável relevante** para este contrato, e isso amplia o escopo do estudo inteiro.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide onde o estudo pode ser citado sem ressalva."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",413],["responde","laboratorio/q100/respostas.py",952]],"p":"mapa/conhecimento/perguntas.md#q051"},{"id":"Q052","c":"k","g":"Q","l":"Q052","d":"Em que domínios o resultado está medido?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"Dois: atendimento ao cliente (98,9% no corpus de replicação) e triagem jurídica (78,5%, ou 90,9% com a instrução de sujeito). Mais código Python para a ordenação, e prosa técnica para a ordenação em prosa. Fora disso, nada foi medido — e a queda de 20 pontos entre um domínio e outro é a razão para não extrapolar.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide onde o estudo pode ser citado sem ressalva."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",419],["responde","laboratorio/q100/respostas.py",962]],"p":"mapa/conhecimento/perguntas.md#q052"},{"id":"Q053","c":"k","g":"Q","l":"Q053","d":"A seleção de contexto vale em prosa ou só em código?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"**Só em código, pelo que está medido.** Em prosa o Jev põe o trecho certo em primeiro 20/21 e o BM25 também 20/21 — empate, com o BM25 custando zero chamada. A vantagem de 22 a 1 da R18 era sobre identificadores de código, contra um BM25 cujo tokenizador nem lia acento. Em prosa, use BM25.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide onde aplicar a Aplicação 3."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",425],["responde","laboratorio/q100/respostas.py",972]],"p":"mapa/conhecimento/perguntas.md#q053"},{"id":"Q054","c":"k","g":"Q","l":"Q054","d":"O estudo vale para texto real, ou só para caso construído?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"**Não vale ainda.** Nenhuma das mensagens de nenhum corpus veio de um canal de produção: todas foram construídas ou geradas por molde. Elas medem discriminação de linguagem, não a bagunça do mundo real — abreviação, emoji, texto cortado, duas perguntas na mesma frase. É a maior ressalva do estudo e está declarada no g…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o que declarar como limite."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",431],["responde","laboratorio/q100/respostas.py",983]],"p":"mapa/conhecimento/perguntas.md#q054"},{"id":"Q055","c":"k","g":"Q","l":"Q055","d":"Qual é o maior buraco de escopo hoje?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"Material real. Todo o resto — línguas, domínio novo, prosa, escala, adversário — já foi coberto por alguma rodada. O que nunca entrou foi uma mensagem escrita por um cliente de verdade, e é justamente sobre ela que a recomendação vai ser aplicada.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide a próxima coleta."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",437],["responde","laboratorio/q100/respostas.py",993]],"p":"mapa/conhecimento/perguntas.md#q055"},{"id":"Q056","c":"k","g":"Q","l":"Q056","d":"O resultado se mantém em contexto muito grande?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"Sim, até 50 mil caracteres: 96,7%, igual ao de 0. A posição do alvo no contexto também não importa (antes ou depois, diferença abaixo de 5 pontos em todos os tamanhos). Diluição não é risco.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se há limite de tamanho a impor."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",443],["responde","laboratorio/q100/respostas.py",1002]],"p":"mapa/conhecimento/perguntas.md#q056"},{"id":"Q057","c":"k","g":"Q","l":"Q057","d":"O resultado se mantém em taxonomia grande?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"Até 12 classes sem custo; de 20 a 147 há um platô em torno de 90%. A condição de 147 opções ainda dá 90,0%. Taxonomia grande é viável — só não é de graça.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quão fina a taxonomia pode ser."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",449],["responde","laboratorio/q100/respostas.py",1011]],"p":"mapa/conhecimento/perguntas.md#q057"},{"id":"Q058","c":"k","g":"Q","l":"Q058","d":"O resultado se mantém sob ruído de digitação?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"Aguenta ruído leve e quebra com ruído pesado — mas **avisa**: em 70% de caracteres corrompidos a acurácia cai para 36,7% e nenhum erro passa de 0,90 de confiança. Normalização prévia ajuda; o corte de confiança cobre o resto.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se o canal precisa de normalização prévia."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",455],["responde","laboratorio/q100/respostas.py",1021]],"p":"mapa/conhecimento/perguntas.md#q058"},{"id":"Q059","c":"k","g":"Q","l":"Q059","d":"O que muda se o canal tiver outra mistura de assuntos?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"Pouco: nas quatro distribuições simuladas a acurácia esperada vai de 95,0% a 97,2% — 2,2 pontos de amplitude. Estime pela mistura do seu canal, mas não espere surpresa: a variação entre assuntos é menor que a variação entre domínios.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide como estimar a acurácia esperada do seu canal."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",461],["responde","laboratorio/q100/respostas.py",1032]],"p":"mapa/conhecimento/perguntas.md#q059"},{"id":"Q060","c":"k","g":"Q","l":"Q060","d":"Que evidência falta para ampliar o escopo com segurança?","a":{"familia":"F · Escopo: onde vale e onde não","resposta":"O terceiro domínio já foi medido (R25) e respondeu: a queda é de **distância do corpus de origem**, não do jurídico. A clínica fica em 63,2% sem a frase de sujeito e 77,9% com ela — abaixo do jurídico e muito abaixo do atendimento. O que continua faltando é o que sempre faltou: **200 mensagens de um canal real, anotad…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o desenho da próxima rodada."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",467],["responde","laboratorio/q100/respostas.py",1040]],"p":"mapa/conhecimento/perguntas.md#q060"},{"id":"Q061","c":"k","g":"Q","l":"Q061","d":"Contra regra por palavra-chave, qual a diferença medida?","a":{"familia":"G · As alternativas","resposta":"Entre 32 e 65 pontos, conforme o corpus: 92,5% contra 60,0% no piloto e 97,5% contra 32,5% na confirmação. Não é melhora incremental — é outra categoria de resultado. Onde o método atual é regra por palavra, trocar vale a pena.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se vale trocar o método atual."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",477],["responde","laboratorio/q100/respostas.py",1053]],"p":"mapa/conhecimento/perguntas.md#q061"},{"id":"Q062","c":"k","g":"Q","l":"Q062","d":"Contra BM25 em código, qual a diferença medida?","a":{"familia":"G · As alternativas","resposta":"Vantagem clara: **22 casos a 1**, p < 0,0001, na colocação do trecho certo entre os dois primeiros. Em código, pagar a chamada se justifica.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se vale pagar uma chamada para ordenar código."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",483],["responde","laboratorio/q100/respostas.py",1061]],"p":"mapa/conhecimento/perguntas.md#q062"},{"id":"Q063","c":"k","g":"Q","l":"Q063","d":"Contra BM25 em prosa, qual a diferença medida?","a":{"familia":"G · As alternativas","resposta":"Empate: 20/21 contra 20/21, pareado 1 a 1. Em prosa o BM25 com tokenizador que entende acento faz o mesmo trabalho de graça. **Não pague a chamada.**","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se vale pagar uma chamada para ordenar prosa."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",489],["responde","laboratorio/q100/respostas.py",1070]],"p":"mapa/conhecimento/perguntas.md#q063"},{"id":"Q064","c":"k","g":"Q","l":"Q064","d":"Contra LLM genérico barato em acurácia, qual a diferença?","a":{"familia":"G · As alternativas","resposta":"Depende de quem escreveu o gabarito, e é por isso que não serve de justificativa. Sob o critério desta casa o Jev ganha de 8 a 15 pontos; sob o de um anotador independente a diferença some. Três experimentos (E10, E11, E12) tentaram desempatar e chegaram ao mesmo lugar.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se o preço quatro vezes maior se justifica por acurácia."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",495],["responde","laboratorio/q100/respostas.py",1079]],"p":"mapa/conhecimento/perguntas.md#q064"},{"id":"Q065","c":"k","g":"Q","l":"Q065","d":"Contra LLM genérico barato sob injeção, qual a diferença?","a":{"familia":"G · As alternativas","resposta":"Contra aviso que imita sistema, vantagem grande: o Jev vira 0/50 e os comparadores até 8/50, **todas com confiança acima do corte**. Contra ordem direta, porém, o Jev também vira (28/78) — a vantagem é de grau, não de natureza, e nenhum dos dois dispensa sanitização.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se o preço se justifica por robustez."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",501],["responde","laboratorio/q100/respostas.py",1088]],"p":"mapa/conhecimento/perguntas.md#q065"},{"id":"Q066","c":"k","g":"Q","l":"Q066","d":"Contra revisão humana, qual a diferença de custo?","a":{"familia":"G · As alternativas","resposta":"US$ 0,4000 contra US$ 0,000032 por decisão — o humano custa **12.339×**. Mas o parâmetro que domina é o tempo de revisão, declarado em 2 minutos e **nunca cronometrado**. Se forem 30 segundos, a economia é um quarto desta. Cronometrar é o passo 3 do guia e continua pendente.","fonte_da_resposta":"conta declarada","confianca":"baixa","decide":"Decide quanto a automação parcial economiza."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",507],["responde","laboratorio/q100/respostas.py",1101]],"p":"mapa/conhecimento/perguntas.md#q066"},{"id":"Q067","c":"k","g":"Q","l":"Q067","d":"Contra revisão humana, qual a diferença de acurácia?","a":{"familia":"G · As alternativas","resposta":"Não se sabe, e essa é a lacuna mais incômoda. O E8 mediu concordância entre dois anotadores humanos — 87,4%, kappa 0,84, com 29 divergências em 230 casos — mas ninguém mediu a acurácia de um humano contra o gabarito no mesmo material. É possível que o Jev, em 98,9%, esteja **acima** do humano típico, e o estudo não po…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se a automação perde qualidade."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",513],["responde","laboratorio/q100/respostas.py",1114]],"p":"mapa/conhecimento/perguntas.md#q067"},{"id":"Q068","c":"k","g":"Q","l":"Q068","d":"Contra não fazer nada, o que se perde?","a":{"familia":"G · As alternativas","resposta":"Num canal de 10.000 decisões/mês, não fazer nada custa US$ 4.000 por mês de tempo de pessoa, ou a qualidade do método por palavra-chave, que erra 40% no piloto e 67% na confirmação. O custo da inação é alto porque a linha de base atual é ruim, não porque o Jev seja caro.","fonte_da_resposta":"conta declarada","confianca":"baixa","decide":"Decide o custo da inação."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",519],["responde","laboratorio/q100/respostas.py",1124]],"p":"mapa/conhecimento/perguntas.md#q068"},{"id":"Q069","c":"k","g":"Q","l":"Q069","d":"Qual alternativa vence em cada aplicação?","a":{"familia":"G · As alternativas","resposta":"Triagem: Jev contra regra por palavra — Jev, com folga. Verificação: Jev contra regra simples — Jev. Ordenação em código: Jev contra BM25 — Jev, demonstrado. Ordenação em prosa: **BM25**, que empata de graça. Guarda de comando: regra **mais** Jev, nunca Jev sozinho.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide a escolha de método por aplicação."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",525],["responde","laboratorio/q100/respostas.py",1137]],"p":"mapa/conhecimento/perguntas.md#q069"},{"id":"Q070","c":"k","g":"Q","l":"Q070","d":"Existe cenário em que uma alternativa domina o Jev?","a":{"familia":"G · As alternativas","resposta":"Sim, dois. **Prosa**: BM25 empata e custa zero. **Texto interno e confiável com tolerância a 88–91% de acerto**: um LLM genérico barato empata sob critério independente e custa um quarto. Fora desses dois, nada dominou o Jev no que foi medido.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide onde não usar o Jev."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",531],["responde","laboratorio/q100/respostas.py",1146]],"p":"mapa/conhecimento/perguntas.md#q070"},{"id":"Q071","c":"k","g":"Q","l":"Q071","d":"Qual latência esperar, mediana e cauda?","a":{"familia":"H · Operação e manutenção","resposta":"Mediana **602 ms**, p90 1816 ms, p99 5640 ms, máximo 32256 ms, sobre 22.668 chamadas respondidas. Fora dessas, 135 estouraram o timeout de 45 s do cliente e nunca voltaram — elas contam para o desenho da repescagem, não para o orçamento de tempo.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o orçamento de tempo do fluxo."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",541],["responde","laboratorio/q100/respostas.py",1156]],"p":"mapa/conhecimento/perguntas.md#q071"},{"id":"Q072","c":"k","g":"Q","l":"Q072","d":"A latência cabe num gancho interativo de editor?","a":{"familia":"H · Operação e manutenção","resposta":"Sim, com uma ressalva que importa. O p99 das chamadas respondidas é 5640 ms, e o roteador em produção mediu 431 ms de mediana em 88 decisões reais. Mas 135 chamadas nunca voltaram, e num gancho interativo isso é pior que lentidão: **é preciso timeout curto e caminho de escape**, senão o editor congela esperando uma re…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se dá para usar no caminho quente."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",547],["responde","laboratorio/q100/respostas.py",1171]],"p":"mapa/conhecimento/perguntas.md#q072"},{"id":"Q073","c":"k","g":"Q","l":"Q073","d":"Qual a taxa de falha de transporte a esperar?","a":{"familia":"H · Operação e manutenção","resposta":"**1,1%** das 24.473 tentativas: 119 estouros do timeout de 45 s do cliente, 107 erros HTTP do provedor, 32 chamadas que saíram e nunca foram conciliadas, 8 respostas fora do contrato. Três repescagens com espera crescente cobrem o caso comum; o que não pode é tratar falha como classe padrão.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o desenho da repescagem."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",553],["responde","laboratorio/q100/respostas.py",1193]],"p":"mapa/conhecimento/perguntas.md#q073"},{"id":"Q074","c":"k","g":"Q","l":"Q074","d":"Em quanto tempo o modelo já derivou, na prática?","a":{"familia":"H · Operação e manutenção","resposta":"**Em menos de 24 horas.** A condição de instrução vazia voltava `http 400` em 30 de 30 no dia 19 e responde 200 com a classe certa e confiança 1 no dia 20. Não é uma deriva que muda recomendação — nenhuma dependia dela —, mas mede a velocidade com que uma propriedade publicada pode morrer. Reverifique semanalmente, no…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide a frequência de reverificação."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",559],["responde","laboratorio/q100/respostas.py",1207]],"p":"mapa/conhecimento/perguntas.md#q074"},{"id":"Q075","c":"k","g":"Q","l":"Q075","d":"Quanto custa monitorar o comportamento continuamente?","a":{"familia":"H · Operação e manutenção","resposta":"US$ 0,000297 por corrida de 8 canários com 2 repetições. Semanal custa centavos por ano; diário custa menos de dois dólares. O custo de monitorar não é argumento para não monitorar.","fonte_da_resposta":"conta declarada","confianca":"alta","decide":"Decide se o monitoramento entra no orçamento."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",565],["responde","laboratorio/q100/respostas.py",1217]],"p":"mapa/conhecimento/perguntas.md#q075"},{"id":"Q076","c":"k","g":"Q","l":"Q076","d":"Qual a frequência adequada de canário?","a":{"familia":"H · Operação e manutenção","resposta":"**Semanal**, com corrida extra antes de qualquer mudança de recomendação. A única deriva observada levou menos de um dia para acontecer, mas foi detectada na primeira corrida seguinte; semanal equilibra detecção e ruído. Diária é viável e custa US$ 0,11 por ano.","fonte_da_resposta":"conta declarada","confianca":"alta","decide":"Decide a configuração do agendamento."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",571],["responde","laboratorio/q100/respostas.py",1228]],"p":"mapa/conhecimento/perguntas.md#q076"},{"id":"Q077","c":"k","g":"Q","l":"Q077","d":"O que fazer quando um canário reprova?","a":{"familia":"H · Operação e manutenção","resposta":"Três passos, nesta ordem. **Um:** confirmar com chamadas extras que não é ruído — a resistência depende da mensagem, e um caso não faz deriva. **Dois:** achar qual afirmação publicada dependia daquela propriedade, o que o campo `sustenta` de cada canário responde por construção. **Três:** corrigir a documentação antes…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o procedimento operacional."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",577],["responde","laboratorio/q100/respostas.py",1237]],"p":"mapa/conhecimento/perguntas.md#q077"},{"id":"Q078","c":"k","g":"Q","l":"Q078","d":"Existe limite conhecido de paralelismo?","a":{"familia":"H · Operação e manutenção","resposta":"Oito linhas em paralelo. Acima disso o E12 registrou 429 em 46 chamadas e a repescagem custou mais tempo do que o paralelismo economizou. A latência mediana do laboratório em paralelo fica dentro de 1,5× a do acesso sequencial, então oito não degrada.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quantas linhas usar na coleta."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",583],["responde","laboratorio/q100/respostas.py",1247]],"p":"mapa/conhecimento/perguntas.md#q078"},{"id":"Q079","c":"k","g":"Q","l":"Q079","d":"Quanto do estudo é reprodutível hoje, por comando?","a":{"familia":"H · Operação e manutenção","resposta":"Praticamente tudo, por comando. As páginas `CEM-HIPOTESES`, `DOSSIE-DE-EVIDENCIAS` e `AUDITORIA-DE-NUMEROS` são geradas do dado bruto e a auditoria confere que estão atualizadas. O que **não** é reproduzível é a coleta em si: refazer uma rodada gasta dinheiro e o modelo não é determinístico. Os artefatos brutos ficam…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o que um terceiro consegue refazer."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",589],["responde","laboratorio/q100/respostas.py",1256]],"p":"mapa/conhecimento/perguntas.md#q079"},{"id":"Q080","c":"k","g":"Q","l":"Q080","d":"Qual a dívida operacional aberta?","a":{"familia":"H · Operação e manutenção","resposta":"Três itens. **Um:** o acerto do roteador em produção nunca foi medido — o registro guardava só o hash, já corrigido, e falta volume. **Dois:** o guarda de comando está em sombra e só entrega o ganho medido se o guarda global passar a perguntar em vez de negar. **Três:** o tempo de revisão humana, que domina toda a con…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o que consertar antes de escalar."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",595],["responde","laboratorio/q100/respostas.py",1266]],"p":"mapa/conhecimento/perguntas.md#q080"},{"id":"Q081","c":"k","g":"Q","l":"Q081","d":"Quantos números publicados são conferidos automaticamente?","a":{"familia":"I · Governança e prova","resposta":"**1132 conferências**, todas refeitas a partir das linhas brutas de resposta com estatística independente da que gerou os resumos, e presas na suíte de testes: um número publicado sem dado que o sustente quebra o `pytest`. 8 itens estão declarados fora de alcance em vez de omitidos.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quanta confiança a documentação merece."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",605],["responde","laboratorio/q100/respostas.py",1277]],"p":"mapa/conhecimento/perguntas.md#q081"},{"id":"Q082","c":"k","g":"Q","l":"Q082","d":"Quantas afirmações são demonstradas, e quantas são só direção?","a":{"familia":"I · Governança e prova","resposta":"Das cem hipóteses: **81 sustentadas**, 18 falsificadas, 1 inconclusiva. No dossiê de evidências, quatro afirmações são `demonstrado`, duas são `direção consistente`, uma é `medição única`, duas são `falsificado`, uma foi `corrigida` e uma `derivou`. Só as quatro primeiras podem ser ditas sem ressalva.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o que pode ser dito sem ressalva."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",611],["responde","laboratorio/q100/respostas.py",1288]],"p":"mapa/conhecimento/perguntas.md#q082"},{"id":"Q083","c":"k","g":"Q","l":"Q083","d":"Quantas afirmações publicadas já caíram?","a":{"familia":"I · Governança e prova","resposta":"**Três**, e todas por medição própria. (1) \"imune a instrução injetada\", derrubada pela R15 e devolvida mais precisa; (2) a versão precisa dela — \"não obedece a quem fala com ele\" —, derrubada pela R21b; (3) a rejeição do endpoint com instrução vazia, derrubada pelo canário em menos de 24 horas. Nenhuma foi derrubada…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quanto desconto aplicar às afirmações atuais."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",617],["responde","laboratorio/q100/respostas.py",1299]],"p":"mapa/conhecimento/perguntas.md#q083"},{"id":"Q084","c":"k","g":"Q","l":"Q084","d":"Quanto tempo se passou entre publicar e corrigir, nas que caíram?","a":{"familia":"I · Governança e prova","resposta":"Horas, nos três casos. A R15 derrubou a imunidade no mesmo dia em que ela foi publicada; a R21b derrubou a versão corrigida no dia seguinte; o canário pegou a deriva do endpoint na primeira corrida dele. O mecanismo funciona **tarde**, que é a única forma que ele tem de funcionar — mas funciona em horas, não em meses.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quanto vale o mecanismo de auditoria."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",623],["responde","laboratorio/q100/respostas.py",1309]],"p":"mapa/conhecimento/perguntas.md#q084"},{"id":"Q085","c":"k","g":"Q","l":"Q085","d":"Um terceiro consegue refazer o estudo com o que está no repositório?","a":{"familia":"I · Governança e prova","resposta":"Sim para a análise, não para a coleta. Todo artefato bruto está versionado, todas as páginas se regeram por comando e a auditoria confere cada número contra o bruto. Refazer a coleta exige a chave do provedor e dinheiro, e o modelo não é determinístico — então a replicação exata é impossível por natureza, não por omis…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se o trabalho é publicável."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",629],["responde","laboratorio/q100/respostas.py",1318]],"p":"mapa/conhecimento/perguntas.md#q085"},{"id":"Q086","c":"k","g":"Q","l":"Q086","d":"Há conflito de interesse na escrita do gabarito?","a":{"familia":"I · Governança e prova","resposta":"Sim, e está declarado. O gabarito das rodadas iniciais foi escrito por mim, que também escolhi os casos — e é exatamente aí que a vantagem sobre os LLMs baratos aparece e some conforme o critério. As rodadas recentes corrigiram isso de três formas: gabarito fixado por molde antes de existir texto, filtro mecânico sem…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quanto peso dar aos resultados de acurácia."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",635],["responde","laboratorio/q100/respostas.py",1328]],"p":"mapa/conhecimento/perguntas.md#q086"},{"id":"Q087","c":"k","g":"Q","l":"Q087","d":"A taxa de falsificação das cem hipóteses é compatível com acaso?","a":{"familia":"I · Governança e prova","resposta":"Não. Foram 18 falsificações, contra 5 esperadas por acaso se todas as hipóteses fossem verdadeiras e o teste tivesse 5% de erro — **3,8× o acaso**. Ainda assim, nenhuma falsificação isolada decide sozinha, e por isso as que mudam recomendação foram refeitas com coleta nova antes de entrar no guia.","fonte_da_resposta":"conta declarada","confianca":"média","decide":"Decide se as falsificações merecem crédito individual."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",641],["responde","laboratorio/q100/respostas.py",1339]],"p":"mapa/conhecimento/perguntas.md#q087"},{"id":"Q088","c":"k","g":"Q","l":"Q088","d":"O que é publicável externamente hoje sem ressalva?","a":{"familia":"I · Governança e prova","resposta":"Quatro afirmações: (1) selecionar contexto responde melhor que carregar tudo, 22 a 5, p = 0,0015; (2) o Jev ordena código melhor que o BM25, 22 a 1, p < 0,0001; (3) como segunda camada, o guarda corta dois terços das confirmações sem soltar irreversível; (4) receber a instrução pelo prompt expõe o comparador a um risc…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o que pode virar material externo."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",647],["responde","laboratorio/q100/respostas.py",1353]],"p":"mapa/conhecimento/perguntas.md#q088"},{"id":"Q089","c":"k","g":"Q","l":"Q089","d":"Qual a afirmação mais frágil ainda de pé?","a":{"familia":"I · Governança e prova","resposta":"A de que **a classe do topo prediz o acerto da resposta**. Ela se apoia em dois casos do lado `irrelevante`, com intervalo de Wilson indo de 0 a 65,8%. A regra operacional que ela sugere é barata e sai de graça, então vale seguir — mas citar o número como evidência seria exagero.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide onde olhar antes de citar."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",653],["responde","laboratorio/q100/respostas.py",1364]],"p":"mapa/conhecimento/perguntas.md#q089"},{"id":"Q090","c":"k","g":"Q","l":"Q090","d":"O orçamento autorizado foi respeitado?","a":{"familia":"I · Governança e prova","resposta":"Sim. **US$ 1,0185 de US$ 5,00** autorizados, em 31.419 chamadas — 20,4% do teto, com US$ 3,9815 restantes. O controle é persistente, a conferência é exata e está presa na suíte de testes.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide se há autorização para continuar."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",659],["responde","laboratorio/q100/respostas.py",1373]],"p":"mapa/conhecimento/perguntas.md#q090"},{"id":"Q091","c":"k","g":"Q","l":"Q091","d":"Qual a próxima medição de maior retorno por dólar?","a":{"familia":"J · Os próximos movimentos","resposta":"**Um terceiro domínio**, por US$ 0,02 e meia hora. A queda de 98,9% para 78,5% entre atendimento e jurídico é o maior sinal aberto do estudo, e com um só ponto de comparação não dá para saber se é o domínio ou a distância ao corpus de origem. É a medição mais barata com a maior consequência.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide a próxima rodada."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",669],["responde","laboratorio/q100/respostas.py",1384]],"p":"mapa/conhecimento/perguntas.md#q091"},{"id":"Q092","c":"k","g":"Q","l":"Q092","d":"Quanto custaria medir o acerto do roteador em produção?","a":{"familia":"J · Os próximos movimentos","resposta":"Quase nada em dinheiro — 500 decisões custam US$ 0,0162 — e o obstáculo não é esse: é **gabarito**. Os pedidos redigidos já são guardados desde a correção do registro, mas alguém precisa dizer qual era a resposta certa. Sem isso, mede-se latência e custo, não acerto.","fonte_da_resposta":"conta declarada","confianca":"alta","decide":"Decide se essa lacuna é barata de fechar."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",675],["responde","laboratorio/q100/respostas.py",1393]],"p":"mapa/conhecimento/perguntas.md#q092"},{"id":"Q093","c":"k","g":"Q","l":"Q093","d":"Quanto custaria anotar 200 mensagens reais?","a":{"familia":"J · Os próximos movimentos","resposta":"Cerca de 13,3 horas de duas pessoas, ou US$ 160 ao custo-hora declarado. É a coisa mais cara que falta no estudo inteiro — e ainda assim é menos de um dia de trabalho. O obstáculo é acesso ao dado, não orçamento.","fonte_da_resposta":"conta declarada","confianca":"baixa","decide":"Decide se a lacuna que destrava tudo é de dinheiro ou de acesso."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",681],["responde","laboratorio/q100/respostas.py",1403]],"p":"mapa/conhecimento/perguntas.md#q093"},{"id":"Q094","c":"k","g":"Q","l":"Q094","d":"O que destrava a adoção em escala?","a":{"familia":"J · Os próximos movimentos","resposta":"**Duzentas mensagens reais e duas pessoas anotando os mesmos casos.** Isso fecha de uma vez a ressalva de material construído, permite calibrar o corte no material certo e dá a primeira medida de acurácia humana comparável. Não é dinheiro — sobram US$ 4,51 do teto. É acesso a dado e tempo de gente.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide onde pedir ajuda."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",687],["responde","laboratorio/q100/respostas.py",1415]],"p":"mapa/conhecimento/perguntas.md#q094"},{"id":"Q095","c":"k","g":"Q","l":"Q095","d":"Qual experimento derrubaria a recomendação principal?","a":{"familia":"J · Os próximos movimentos","resposta":"**Já foi feito (R26), e a recomendação central inverte onde a resposta está dividida.** Em 80 perguntas que exigem dois trechos, mandar o primeiro que o Jev escolheu acerta 6/80 contra 60/80 mandando os oito (54 a 0); k = 2 dá 40/80 e k = 3, 50/80, já sem diferença significativa. A mesma primeira pergunta sozinha cont…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o teste adversarial a fazer antes de escalar."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",693],["responde","laboratorio/q100/respostas.py",1424]],"p":"mapa/conhecimento/perguntas.md#q095"},{"id":"Q096","c":"k","g":"Q","l":"Q096","d":"Quanto resta do orçamento, e o que ele compra?","a":{"familia":"J · Os próximos movimentos","resposta":"Restam **US$ 3,9815**, que compram cerca de 122.823 chamadas — mais de nove vezes tudo que foi gasto até aqui (31.419 chamadas). O orçamento não é o limite deste trabalho; tempo e acesso a dado real são.","fonte_da_resposta":"conta declarada","confianca":"alta","decide":"Decide o tamanho do próximo programa."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",699],["responde","laboratorio/q100/respostas.py",1448]],"p":"mapa/conhecimento/perguntas.md#q096"},{"id":"Q097","c":"k","g":"Q","l":"Q097","d":"Que fração das cem hipóteses aponta para trabalho novo?","a":{"familia":"J · Os próximos movimentos","resposta":"18 falsificadas e 1 inconclusiva — **19% das cem** apontam para trabalho. Metade já foi feita nesta rodada (as defesas, a generalização); a outra metade virou ressalva declarada, que é a forma honesta de deixar trabalho em aberto.","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide quanto trabalho a varredura gerou."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",705],["responde","laboratorio/q100/respostas.py",1461]],"p":"mapa/conhecimento/perguntas.md#q097"},{"id":"Q098","c":"k","g":"Q","l":"Q098","d":"Qual risco identificado ainda não tem mitigação medida?","a":{"familia":"J · Os próximos movimentos","resposta":"**Um, e ele voltou a existir depois da R23:** a ordem direta escrita de um jeito que a lista não conhece vira 45% das decisões, e a única mitigação medida contra ela é **detecção** (95% pelo sentinela), não prevenção. Detectar autoriza recusar ou mandar para gente; não devolve a resposta certa. A oscilação entre chama…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o que não pode ir para produção ainda."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",711],["responde","laboratorio/q100/respostas.py",1474]],"p":"mapa/conhecimento/perguntas.md#q098"},{"id":"Q099","c":"k","g":"Q","l":"Q099","d":"O que deve entrar em produção primeiro, e com que salvaguarda?","a":{"familia":"J · Os próximos movimentos","resposta":"**Ordenação de contexto, com k = 1 para pergunta de fonte única e k = 3 quando não se sabe**, dentro de um fluxo que já usa modelo caro. A R26 tirou o k = 1 incondicional: com resposta dividida em dois trechos ele acerta 6/80 e a regra de recall de graça não avisa. Salvaguardas que não custam chamada: classe de escape…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o plano de implantação."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",717],["responde","laboratorio/q100/respostas.py",1491]],"p":"mapa/conhecimento/perguntas.md#q099"},{"id":"Q100","c":"k","g":"Q","l":"Q100","d":"Se o trabalho parar hoje, o que fica de valor reaproveitável?","a":{"familia":"J · Os próximos movimentos","resposta":"O método, não os números. Fica **a auditoria** que recalcula cada número publicado a partir do bruto e quebra a suíte quando a documentação envelhece; ficam os **canários** que pegam deriva do modelo em horas; fica o **registro de retratações** legível por máquina; ficam os **geradores de corpus com gabarito fixado po…","fonte_da_resposta":"dado medido","confianca":"alta","decide":"Decide o que preservar."},"m":{},"w":[["documenta","docs/CEM-PERGUNTAS-ESTRATEGICAS.md",723],["responde","laboratorio/q100/respostas.py",1505]],"p":"mapa/conhecimento/perguntas.md#q100"},{"id":"S01","c":"k","g":"S","l":"S01","d":"Jev CLI","a":{"rodada_simples":"12 cenários","teto":"12 / 0"},"m":{},"w":[["define","planning/protocolo.md",70]],"p":"mapa/conhecimento/sistemas.md#s01"},{"id":"S02","c":"k","g":"S","l":"S02","d":"Jev Search","a":{"rodada_simples":"8 consultas","teto":"16 / 0"},"m":{},"w":[["define","planning/protocolo.md",71]],"p":"mapa/conhecimento/sistemas.md#s02"},{"id":"S03","c":"k","g":"S","l":"S03","d":"Janus","a":{"rodada_simples":"12 registros pareados","teto":"0 / 0"},"m":{},"w":[["define","planning/protocolo.md",72]],"p":"mapa/conhecimento/sistemas.md#s03"
